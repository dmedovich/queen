# Example Queen CLI config for an application repository.

config_locked: false

naming:
  pattern: sequential-padded
  padding: 3
  enforce: true

development:
  driver: postgres
  dsn: "postgres://localhost/myapp?sslmode=disable"
  table: queen_migrations
  lock_timeout: 5m

test:
  driver: sqlite
  dsn: "./test.db?_journal_mode=WAL"
  table: queen_migrations
  lock_timeout: 1m

production:
  driver: postgres
  dsn: "${DATABASE_URL}"
  table: queen_migrations
  lock_timeout: 30m
  require_confirmation: true
  require_explicit_unlock: true
